<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle District</title>
<link rel="stylesheet" href="style.A4A8BF44.css">
<link rel="stylesheet" href="menu-addon.css?v=3.0.1">
<!-- Start fetching the 3D engine + game code immediately, in parallel with the
     rest of the page, instead of waiting until the parser reaches them. -->
<link rel="modulepreload" href="vendor/three/three.module.min.js?v=3.0.1" crossorigin>
<link rel="modulepreload" href="game.7LCERBLR.js?v=3.0.1">
<link rel="preload" as="script" href="vendor/peerjs/peerjs.min.js?v=3.0.1">
<!-- Web fonts are cosmetic: load them without blocking first paint, so a
     slow or blocked font server can never hold up the game. -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600&display=swap">
<!-- three.js ships with the game under vendor/, so this is a plain static
     import map: no CDN, no fallback, nothing to wait on. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js?v=3.0.1",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<noscript><div style="position:fixed;inset:0;background:#f6f3e6;color:#1a30c0;display:flex;align-items:center;justify-content:center;font-family:cursive;font-size:24px;text-align:center;padding:20px;">Doodle District needs JavaScript enabled to run.<br>Please enable JavaScript and reload.</div></noscript>
<!-- PeerJS ships with the game: multiplayer no longer depends on a CDN
     being reachable. -->
<script src="vendor/peerjs/peerjs.min.js?v=3.0.1"></script>
<!-- ?v= busts stale cached copies of the fixed menu (tabs used to break / vanish) -->
<script src="supabase-sync.js?v=3.0.1"></script>
<script src="menu-system.js?v=3.0.1"></script>
<script src="rocket-launcher.js?v=3.0.1"></script>
<script src="tutorial.js?v=3.0.1"></script>
<script type="module" src="game.7LCERBLR.js?v=3.0.1"></script>
<!-- Vercel Web Analytics: only requested when actually hosted on Vercel, so
     every other host stops paying for a guaranteed 404 on every page load. -->
<script>
window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
if (/\.vercel\.app$/.test(location.hostname)) {
  var vs = document.createElement('script');
  vs.defer = true;
  vs.src = '_vercel/insights/script.js.br';
  document.body.appendChild(vs);
}
</script>
</body>
</html>
