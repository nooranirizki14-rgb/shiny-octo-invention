<!-- Boot loader: loading screen + plain-language error overlay, so a failed
     boot can never look like a blank page again. Must run first. -->
<script src="boot.js?v=3.0.1"></script>
<!-- Import map for three.js. Injected by script (instead of a static tag) so
     the boot overlay can offer a one-click alternate-CDN fallback: the choice
     is stored in localStorage 'dd_cdn' ('jsdelivr' default, 'unpkg' alt).
     This runs synchronously in <head>, before any module loads. -->
<script>
(function () {
  try {
    var choice = 'jsdelivr';
    try { if (localStorage.getItem('dd_cdn') === 'unpkg') choice = 'unpkg'; } catch (e) {}
    var base = choice === 'unpkg'
      ? 'https://unpkg.com/three@0.170.0/'
      : 'https://cdn.jsdelivr.net/npm/three@0.170.0/';
    var el = document.createElement('script');
    el.type = 'importmap';
    el.textContent = JSON.stringify({ imports: {
      'three': base + 'build/three.module.js',
      'three/addons/': base + 'examples/jsm/'
    } });
    document.head.appendChild(el);
  } catch (e) { /* boot.js watchdog will explain what went wrong */ }
})();
</script>
</head>
<body>
