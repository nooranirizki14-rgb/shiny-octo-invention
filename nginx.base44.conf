user root;
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;

  # The 3D engine is ~675KB of JS uncompressed and ~170KB gzipped. Serving it
  # compressed is the single biggest win for how long the loading screen sits
  # there, so make sure every text asset goes out gzipped.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json
    image/svg+xml;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri $uri/ =404; }

    # Vendored libraries are versioned by their folder and never change in
    # place, so let the browser keep them: a reload should not re-download
    # the whole 3D engine.
    location /vendor/ {
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # index.html must always be revalidated, otherwise players get stuck on a
    # stale page that points at old ?v= asset URLs.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }
  }
}
